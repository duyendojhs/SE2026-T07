services:
  postgres:
    image: postgres:16-alpine
    container_name: se2026_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coach_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coach_password}
      POSTGRES_DB: ${POSTGRES_DB:-github_coach_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: se2026_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: se2026_backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-coach_user}:${POSTGRES_PASSWORD:-coach_password}@postgres:5432/${POSTGRES_DB:-github_coach_db}
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me-32-bytes-minimum}
      AUDIT_HMAC_SECRET: ${AUDIT_HMAC_SECRET:-dev-only-change-me-32-bytes-minimum}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_PRIVATE_KEY_PATH: ${GITHUB_PRIVATE_KEY_PATH:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-http://localhost:8000/api/v1/auth/github/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TENANT_SLUG: ${TENANT_SLUG:-se2026-t07}
      TENANT_NAME: ${TENANT_NAME:-SE2026-T07 Entropy}
      BACKFILL_DAYS: ${BACKFILL_DAYS:-90}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
