services:
  postgres:
    image: postgres:16-alpine
    container_name: se2026_postgres
    environment:
      POSTGRES_USER: coach_user
      POSTGRES_PASSWORD: coach_password
      POSTGRES_DB: github_coach_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
