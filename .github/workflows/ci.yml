name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  governance-audit:
    name: Architecture & Governance Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Core Governance Assets
        run: |
          test -f PRIVACY.md || { echo "ERROR: PRIVACY.md is missing"; exit 1; }
          test -f compose.yml || { echo "ERROR: compose.yml is missing"; exit 1; }
          test -f .ai/AGENTS.md || { echo "ERROR: .ai/AGENTS.md is missing"; exit 1; }
          test -f docs/BUILD-CONTRACT.md || { echo "ERROR: BUILD-CONTRACT.md is missing"; exit 1; }
          test -f docs/adr/ADR-001-modular-monolith.md || { echo "ERROR: ADR-001 is missing"; exit 1; }
          test -f docs/adr/ADR-002-multi-tenant.md || { echo "ERROR: ADR-002 is missing"; exit 1; }
          test -f docs/adr/ADR-003-metadata-only.md || { echo "ERROR: ADR-003 is missing"; exit 1; }
          test -f docs/adr/ADR-004-rule-dsl.md || { echo "ERROR: ADR-004 is missing"; exit 1; }
          test -f docs/adr/ADR-005-llm-narrates.md || { echo "ERROR: ADR-005 is missing"; exit 1; }
          test -d backend/tests/mocks || { echo "ERROR: backend/tests/mocks is missing"; exit 1; }
          test -d backend/tests/rules || { echo "ERROR: backend/tests/rules is missing"; exit 1; }
          echo "All structural and governance validations passed successfully."

  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

  compose-config:
    name: Compose Configuration Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config -q
