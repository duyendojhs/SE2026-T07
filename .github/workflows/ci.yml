name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  governance-audit:
    name: Architecture & Governance Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Core Governance Assets
        run: |
          test -f PRIVACY.md || { echo "ERROR: PRIVACY.md is missing"; exit 1; }
          test -f compose.yml || { echo "ERROR: compose.yml is missing"; exit 1; }
          test -f .ai/AGENTS.md || { echo "ERROR: .ai/AGENTS.md is missing"; exit 1; }
          test -f docs/BUILD-CONTRACT.md || { echo "ERROR: BUILD-CONTRACT.md is missing"; exit 1; }
          test -f docs/adr/ADR-001-modular-monolith.md || { echo "ERROR: ADR-001 is missing"; exit 1; }
          test -f docs/adr/ADR-002-multi-tenant.md || { echo "ERROR: ADR-002 is missing"; exit 1; }
          test -f docs/adr/ADR-003-metadata-only.md || { echo "ERROR: ADR-003 is missing"; exit 1; }
          test -f docs/adr/ADR-004-rule-dsl.md || { echo "ERROR: ADR-004 is missing"; exit 1; }
          test -f docs/adr/ADR-005-llm-narrates.md || { echo "ERROR: ADR-005 is missing"; exit 1; }
          test -f docs/adr/ADR-006-postgresql.md || { echo "ERROR: ADR-006 is missing"; exit 1; }
          test -f docs/adr/ADR-008-audit-hash-chain.md || { echo "ERROR: ADR-008 is missing"; exit 1; }
          test -d backend/tests/mocks || { echo "ERROR: backend/tests/mocks is missing"; exit 1; }
          test -d backend/tests/rules || { echo "ERROR: backend/tests/rules is missing"; exit 1; }
          echo "All structural and governance validations passed successfully."

  backend:
    name: Backend Lint, Types, Migrations & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coach_user
          POSTGRES_PASSWORD: coach_password
          POSTGRES_DB: github_coach_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coach_user -d github_coach_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://coach_user:coach_password@localhost:5432/github_coach_db
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: ci-only-session-secret-32-bytes-min
      AUDIT_HMAC_SECRET: ci-only-audit-secret-32-bytes-min
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: Apply migrations
        run: alembic upgrade head

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

  compose-config:
    name: Compose Configuration Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config -q
